name: Deploy stand

# Manual deployment of a chosen ref to the user's server over SSH (runbook:
# deploy/README.md). Never runs on push. The checkout is copied with rsync
# (no .git, data, artefacts, node_modules, .venv or .env) and built on the
# server, so the server needs no access to this repository.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or full commit SHA to deploy (rollback = an earlier ref)"
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-stand
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to stand over SSH
    runs-on: ubuntu-24.04
    # The repository has one public demo stand, configured as the "production"
    # environment. Add required reviewers there to approve each run by hand.
    environment: production
    timeout-minutes: 45
    env:
      # ---- Map the production environment values to the internal names used by
      # ---- the deployment script. Host metadata is non-sensitive; SSH material
      # ---- remains in environment secrets.
      DEPLOY_HOST: ${{ vars.VPS_HOST }}
      DEPLOY_PORT: ${{ vars.VPS_PORT }}
      DEPLOY_USER: ${{ vars.VPS_USER }}
      DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      # ---- Non-secret settings.
      DEPLOY_REF: ${{ inputs.ref }}
      DEPLOY_LOG_LINES: ${{ vars.DEPLOY_LOG_LINES || '150' }}
      DEPLOY_SMOKE_TIMEOUT: "180"
    steps:
      - name: Validate inputs and secrets
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret mapped to $name is empty or missing"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          if ! printf '%s' "$DEPLOY_PATH" | grep -Eq '^/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)+$'; then
            echo "::error::DEPLOY_PATH must be an absolute path with at least two components, e.g. /srv/infra-pulse"
            exit 1
          fi
          if [ -n "$DEPLOY_PORT" ] && ! printf '%s' "$DEPLOY_PORT" | grep -Eq '^[0-9]{1,5}$'; then
            echo "::error::DEPLOY_PORT must be numeric"
            exit 1
          fi
          if ! printf '%s' "$DEPLOY_REF" | grep -Eq '^[A-Za-z0-9._/-]+$' || [[ "$DEPLOY_REF" == *..* ]]; then
            echo "::error::ref contains unsupported characters"
            exit 1
          fi
          if ! printf '%s' "$DEPLOY_LOG_LINES" | grep -Eq '^[0-9]{1,4}$'; then
            echo "::error::DEPLOY_LOG_LINES must be a number"
            exit 1
          fi

      - name: Check out the requested ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve revision
        id: rev
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $DEPLOY_REF at $sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate server Compose configuration
        env:
          # Placeholders, not secrets: compose.public.yaml requires these keys; the real
          # values exist only in the server .env. Validates the public override (B3).
          PUBLIC_HOST: stand.example.invalid
          ACME_EMAIL: ops@example.invalid
          LLDAP_JWT_SECRET: ci-placeholder
          LLDAP_KEY_SEED: ci-placeholder
          LLDAP_ADMIN_PASSWORD: ci-placeholder
        run: |
          docker compose version
          docker compose -f compose.yaml -f deploy/compose.server.yaml \
            --env-file deploy/.env.server.example \
            --profile tools --profile received --profile backup \
            config --quiet
          docker compose -f compose.yaml -f deploy/compose.server.yaml \
            -f deploy/compose.public.yaml \
            --env-file deploy/.env.server.example \
            --profile tools --profile received --profile backup --profile analytics \
            config --quiet

      - name: Lint deployment scripts
        run: |
          # remote-deploy, backup, restore and the Grafana reader run on the server; lldap
          # scripts in its container.
          shellcheck --version
          shellcheck deploy/*.sh deploy/lldap/*.sh deploy/grafana/*.sh

      - name: Configure SSH with the pinned host key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts_deploy
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts_deploy
          port="${DEPLOY_PORT:-22}"
          if [ "$port" = 22 ]; then host_key="$DEPLOY_HOST"; else host_key="[$DEPLOY_HOST]:$port"; fi
          if ! ssh-keygen -F "$host_key" -f ~/.ssh/known_hosts_deploy > /dev/null; then
            echo "::error::DEPLOY_KNOWN_HOSTS has no entry for the deploy host and port"
            exit 1
          fi
          {
            echo "Host stand"
            echo "  HostName $DEPLOY_HOST"
            echo "  Port $port"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts_deploy"
            echo "  GlobalKnownHostsFile /dev/null"
            echo "  UpdateHostKeys no"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 30"
            echo "  ServerAliveCountMax 6"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Preflight on the server
        run: |
          # Values are expanded on the runner on purpose; they were validated above.
          # shellcheck disable=SC2029
          ssh stand "set -e
            test -d '$DEPLOY_PATH' || { echo 'DEPLOY_PATH does not exist on the server' >&2; exit 1; }
            test -f '$DEPLOY_PATH/shared/.env' || { echo 'shared/.env is missing on the server' >&2; exit 1; }
            command -v rsync > /dev/null || { echo 'rsync is not installed on the server' >&2; exit 1; }
            docker compose version
            mkdir -p '$DEPLOY_PATH/app'"

      - name: Deliver the checkout (rsync, filtered)
        run: |
          command -v rsync > /dev/null || { sudo apt-get update && sudo apt-get install -y rsync; }
          rsync --recursive --links --perms --times --compress --checksum --delete \
            --filter='merge deploy/rsync-filter' \
            --itemize-changes --stats \
            ./ "stand:$DEPLOY_PATH/app/"

      - name: Build, start and smoke-test on the server
        env:
          REVISION: ${{ steps.rev.outputs.sha }}
        run: |
          # shellcheck disable=SC2029
          ssh stand "bash '$DEPLOY_PATH/app/deploy/remote-deploy.sh' \
            --revision '$REVISION' --ref '$DEPLOY_REF' \
            --smoke-timeout '$DEPLOY_SMOKE_TIMEOUT' --log-lines '$DEPLOY_LOG_LINES'"

      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts_deploy ~/.ssh/config
