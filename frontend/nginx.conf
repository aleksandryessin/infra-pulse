server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Uploads (B1, 50 MB CSV) and API batches (B1x, 5 MiB) pass through here; the
    # nginx default of 1 MB would answer 413 before the API. Caddy allows 55 MB too.
    client_max_body_size 55m;
    location /api/ { 
        proxy_pass http://api:8000; 
    }
    location /health/ { 
        proxy_pass http://api:8000; 
    }
    location / { 
        try_files $uri $uri/ /index.html; 
    }
}

